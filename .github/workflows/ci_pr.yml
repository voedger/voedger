name: CI on Pull Request

on:
  pull_request:
    paths-ignore:
      - 'pkg/istorage/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  call-workflow-ci:
    if: github.repository == 'voedger/voedger'
    uses: untillpro/ci-action/.github/workflows/ci_pr.yml@main
    with:
      short_test: "true"
      running_workflow: "CI pkg-cmd PR"
      go_race: "false"
      install_tinygo: "true"
    secrets:
      reporeading_token: ${{ secrets.GITHUB_TOKEN }}
